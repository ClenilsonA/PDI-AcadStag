{% extends "base.html" %}
{% block content %}

<div class="flex justify-center py-10">
  <div class="w-full max-w-2xl bg-white shadow rounded-lg p-6">

    <h2 class="text-2xl font-semibold mb-2">Candidatar-se</h2>
    <p class="text-gray-500 mb-6">
      <b>Estágio:</b> {{ estagio.titulo }}
    </p>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}

      <!-- CV -->
      <div>
        <label class="block text-sm font-medium mb-1">
          Curriculum Vitae (PDF) *
        </label>

        <input
          type="file"
          name="cv"
          accept="application/pdf"
          required
          class="w-full border border-gray-300 rounded px-3 py-2
                 focus:ring-2 focus:ring-blue-500 focus:outline-none"
        >

        {% if form.cv.errors %}
        <p class="text-red-500 text-sm mt-1">
          {{ form.cv.errors }}
        </p>
        {% endif %}
      </div>

      <div class="flex gap-2">
        <button
          type="submit"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Submeter candidatura
        </button>

        <a
          href="{% url 'estagios:detail' estagio.id %}"
          class="border border-gray-300 px-4 py-2 rounded hover:bg-gray-100">
          Cancelar
        </a>
      </div>

    </form>

    <div class="mt-6 bg-blue-50 border border-blue-200 p-3 rounded text-blue-700">
      O CV deve ser submetido em <b>PDF</b>.
    </div>

  </div>
</div>

{% endblock %}
