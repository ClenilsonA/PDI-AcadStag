{% extends "base.html" %}
{% block content %}

<div class="flex items-center justify-center min-h-[60vh]">
  <div class="w-full max-w-md bg-white shadow-md rounded-lg p-6 text-center">

    <h4 class="text-xl font-semibold mb-3">Terminar sessão</h4>

    <p class="text-gray-500 mb-6">
      Tens a certeza que queres sair do AcadStag?
    </p>

    <div class="flex justify-center gap-2 flex-wrap">
      <a
        href="{% url 'accounts:logout_confirm' %}"
        class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition"
      >
        Confirmar Logout
      </a>

      <a
        href="{% url 'estagios:list' %}"
        class="border border-gray-300 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-50 transition"
      >
        Cancelar
      </a>
    </div>

  </div>
</div>

{% endblock %}
