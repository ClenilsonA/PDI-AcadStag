{% extends "base.html" %}
{% block content %}

<div class="flex items-center justify-center min-h-[70vh]">
  <div class="w-full max-w-2xl bg-white shadow-md rounded-lg p-8 text-center">

    <h3 class="text-2xl font-semibold mb-2">
      Criar conta
    </h3>

    <p class="text-gray-500 mb-6">
      Escolhe o tipo de conta para registar.
    </p>

    <div class="flex gap-3 justify-center flex-wrap">
      <a
        href="{% url 'accounts:register_aluno' %}"
        class="bg-blue-600 text-white px-6 py-3 rounded-md text-lg font-medium hover:bg-blue-700 transition"
      >
        Sou Aluno
      </a>

      <a
        href="{% url 'accounts:register_empresa' %}"
        class="border border-blue-600 text-blue-600 px-6 py-3 rounded-md text-lg font-medium hover:bg-blue-50 transition"
      >
        Sou Empresa
      </a>
    </div>

    <div class="border-t my-6"></div>

    <p class="text-gray-500">
      Já tens conta?
      <a href="{% url 'accounts:login' %}" class="text-blue-600 hover:underline">
        Entrar
      </a>
    </p>

  </div>
</div>

{% endblock %}
