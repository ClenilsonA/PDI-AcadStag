{% extends "base.html" %}
{% block content %}

<style>
  .fx input[type="text"], .fx input[type="number"], .fx input[type="email"],
  .fx select, .fx textarea {
    width: 100%; border: 1px solid #e2e8f0; border-radius: 12px;
    padding: .55rem .8rem; font-size: .92rem; color: #0f172a; background: #fff;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .fx input:focus, .fx select:focus, .fx textarea:focus {
    outline: none; border-color: #6d28d9; box-shadow: 0 0 0 3px rgba(109,40,217,.15);
  }
  .fx input::placeholder { color: #94a3b8; }
  .fx label { display: block; font-size: .875rem; font-weight: 500; color: #334155; margin-bottom: .25rem; }
  .fx p { margin: 0 0 1rem; }
  .fx .helptext { font-size: .8rem; color: #94a3b8; }
  .fx ul.errorlist { list-style: none; padding: 0; margin: .25rem 0 0; color: #dc2626; font-size: .8rem; }
</style>

<div class="flex justify-center py-10">
  <div class="fx w-full max-w-3xl rounded-2xl border border-slate-200 bg-white p-7 shadow-sm">

    <h1 class="mb-6 text-2xl font-bold tracking-tight text-slate-900">{{ modo }} estágio</h1>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div class="space-y-4">
        {{ form.as_p }}
      </div>

      <div class="flex gap-3 pt-4">
        <button type="submit"
                style="background-image:linear-gradient(135deg,#2dd4bf,#6d28d9)"
                class="rounded-2xl px-5 py-2.5 font-semibold text-white shadow-lg shadow-violet-700/20 transition hover:-translate-y-0.5 hover:shadow-xl">
          {{ modo }}
        </button>
        <a href="{% url 'estagios:empresa_list' %}" class="rounded-2xl border border-slate-200 px-5 py-2.5 font-medium text-slate-700 transition hover:bg-slate-50">Voltar</a>
      </div>
    </form>

  </div>
</div>

{% endblock %}
