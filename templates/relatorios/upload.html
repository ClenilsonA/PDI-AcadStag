{% extends "base.html" %}
{% block content %}

<div class="flex justify-center">
  <div class="w-full max-w-2xl">

    <div class="bg-white shadow rounded-lg p-6">

      <h2 class="text-2xl font-semibold mb-2">Submeter relatório</h2>
      <p class="text-gray-500 mb-6">
        <b>Estágio:</b> {{ candidatura.estagio.titulo }}
      </p>

      <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="flex gap-2 pt-2">
          <button
            type="submit"
            class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition"
          >
            Enviar
          </button>

          <a
            href="{% url 'relatorios:aluno_list' %}"
            class="border border-gray-300 text-gray-700 px-4 py-2 rounded hover:bg-gray-100 transition"
          >
            Voltar
          </a>
        </div>
      </form>

      <div class="mt-6 rounded-md border border-blue-200 bg-blue-50 px-4 py-3 text-blue-800">
        Recomendação: submete em <b>PDF</b>.
      </div>

    </div>

  </div>
</div>

{% endblock %}
