{% extends "base.html" %}
{% block content %}

<div class="flex justify-center py-10">
  <div class="w-full max-w-3xl bg-white shadow rounded-lg p-6">

    <h2 class="text-2xl font-semibold mb-4">Avaliar estágio</h2>

    <div class="mb-4 text-gray-600">
      <div><b>Aluno:</b> {{ candidatura.aluno.username }}</div>
      <div><b>Estágio:</b> {{ candidatura.estagio.titulo }}</div>
    </div>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div class="space-y-4">
        {{ form.as_p }}
      </div>

      <div class="flex gap-3 pt-2">
        <button
          type="submit"
          class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition"
        >
          Guardar
        </button>

        <a
          href="{% url 'avaliacoes:orientador_list' %}"
          class="border border-gray-300 px-4 py-2 rounded-md text-gray-700 hover:bg-gray-100 transition"
        >
          Voltar
        </a>
      </div>
    </form>

    <div class="mt-6 rounded-md border border-blue-200 bg-blue-50 px-4 py-3 text-blue-800">
      Dica: usa comentários curtos e objetivos.
    </div>

  </div>
</div>

{% endblock %}
