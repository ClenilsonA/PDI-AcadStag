{% extends "base.html" %}
{% block content %}
<style>
  .fx input:not([type=checkbox]):not([type=radio]):not([type=file]), .fx select, .fx textarea {
    width:100%; border:1px solid #e2e8f0; border-radius:12px; padding:.55rem .8rem;
    font-size:.92rem; color:#0f172a; background:#fff; transition:border-color .15s ease, box-shadow .15s ease;
  }
  .fx textarea { min-height:110px; }
  .fx input:focus, .fx select:focus, .fx textarea:focus { outline:none; border-color:#6d28d9; box-shadow:0 0 0 3px rgba(109,40,217,.15); }
  .fx input[type=file] { padding:.45rem .6rem; }
  .fx input[type=file]::file-selector-button { margin-right:.8rem; border:0; border-radius:8px; cursor:pointer; padding:.4rem .9rem; font-weight:600; color:#fff; background-image:linear-gradient(135deg,#2dd4bf,#6d28d9); }
</style>

<div class="flex justify-center py-10">
  <div class="fx w-full max-w-2xl overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
    <div style="height:4px;background:linear-gradient(90deg,#2dd4bf,#6d28d9)"></div>

    <div class="p-6 md:p-7">
      <h2 class="text-2xl font-semibold text-slate-900">Enviar certificado</h2>
      <p class="mt-2 mb-6 text-sm text-slate-500">
        <b class="text-slate-700">Aluno:</b> {{ candidatura.aluno.username }}<br>
        <b class="text-slate-700">Estágio:</b> {{ candidatura.estagio.titulo }}
      </p>

      <form method="post" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="flex flex-wrap gap-3 pt-2">
          <button type="submit" style="background-image:linear-gradient(135deg,#2dd4bf,#6d28d9)" class="rounded-2xl px-6 py-3 text-sm font-semibold text-white shadow-lg shadow-violet-700/20 transition hover:-translate-y-0.5 hover:shadow-xl">Guardar certificado</button>
          <a href="{% url 'processos:list' %}" class="rounded-2xl border border-slate-200 px-6 py-3 text-sm font-medium text-slate-700 transition hover:bg-slate-50">Voltar</a>
        </div>
      </form>

      <div class="mt-6 rounded-xl border border-violet-100 bg-violet-50 px-4 py-3">
        <p class="text-sm text-violet-900">O certificado deve ser submetido em <b>PDF</b>.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
