{% extends "base.html" %}
{% block content %}

<div class="flex justify-center py-10">
  <div class="w-full max-w-2xl bg-white shadow rounded-lg p-6">
    <h2 class="text-2xl font-semibold mb-2">Enviar certificado</h2>
    <p class="text-gray-500 mb-6">
      <b>Aluno:</b> {{ candidatura.aluno.username }}<br>
      <b>Estágio:</b> {{ candidatura.estagio.titulo }}
    </p>

    <form method="post" enctype="multipart/form-data" class="space-y-4">
      {% csrf_token %}
      {{ form.as_p }}

      <div class="flex gap-2">
        <button
          type="submit"
          class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
          Guardar certificado
        </button>

        <a
          href="{% url 'avaliacoes:orientador_list' %}"
          class="border border-gray-300 px-4 py-2 rounded hover:bg-gray-100">
          Voltar
        </a>
      </div>
    </form>

    <div class="mt-6 bg-blue-50 border border-blue-200 p-3 rounded text-blue-700">
      O certificado deve ser submetido em <b>PDF</b>.
    </div>
  </div>
</div>

{% endblock %}
